<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradArachide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#feebc8"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dd6b20"/>
      <stop offset="50%" stop-color="#c05621"/>
      <stop offset="100%" stop-color="#7b341e"/>
    </linearGradient>
    <linearGradient id="nutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#dd6b20"/>
    </linearGradient>
    <linearGradient id="innerNutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="shadowArachide" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#7b341e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="400" height="400" rx="32" fill="url(#bgGradArachide)"/>
  
  <!-- CERCLE DÉCORATIF -->
  <circle cx="200" cy="185" r="130" fill="#fbd38d" opacity="0.4"/>

  <g filter="url(#shadowArachide)" transform="translate(0, -5)">
    <!-- Arachide en gousse Principale 1 -->
    <g transform="translate(190, 160) rotate(-25)">
      <!-- Forme caractéristique en 8 de la gousse d'arachide -->
      <path d="M -60,0 C -60,-35 -25,-40 0,-20 C 25,-40 60,-35 60,0 C 60,35 25,40 0,20 C -25,40 -60,35 -60,0 Z" fill="url(#shellGrad)"/>
      <!-- Lignes de texture croisées sur la coque -->
      <path d="M -45,-10 Q 0,-5 45,-10 M -40,10 Q 0,5 40,10" stroke="#9c4221" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M -30,-20 Q -20,0 -30,20 M 0,-15 Q 0,0 0,15 M 30,-20 Q 20,0 30,20" stroke="#9c4221" stroke-width="2.5" fill="none" opacity="0.6"/>
    </g>

    <!-- Arachide en gousse 2 -->
    <g transform="translate(230, 210) rotate(35)">
      <path d="M -50,0 C -50,-30 -20,-35 0,-15 C 20,-35 50,-30 50,0 C 50,30 20,35 0,15 C -20,35 -50,30 -50,0 Z" fill="url(#shellGrad)"/>
      <path d="M -35,-8 Q 0,-4 35,-8 M -30,8 Q 0,4 30,8" stroke="#9c4221" stroke-width="2" fill="none" opacity="0.6"/>
    </g>

    <!-- Grains d'arachides décortiqués au premier plan -->
    <!-- Grain 1 -->
    <g transform="translate(130, 230) rotate(15)">
      <ellipse cx="0" cy="0" rx="22" ry="32" fill="url(#nutGrad)"/>
      <ellipse cx="-4" cy="-5" rx="14" ry="22" fill="url(#innerNutGrad)" opacity="0.5"/>
    </g>
    <!-- Grain 2 -->
    <g transform="translate(175, 255) rotate(-40)">
      <ellipse cx="0" cy="0" rx="20" ry="30" fill="url(#nutGrad)"/>
      <ellipse cx="-3" cy="-4" rx="12" ry="20" fill="url(#innerNutGrad)" opacity="0.5"/>
    </g>
    <!-- Grain 3 -->
    <g transform="translate(270, 250) rotate(50)">
      <ellipse cx="0" cy="0" rx="18" ry="26" fill="url(#nutGrad)"/>
      <ellipse cx="-3" cy="-3" rx="11" ry="17" fill="url(#innerNutGrad)" opacity="0.5"/>
    </g>
  </g>

  <!-- Etiquette Produit -->
  <rect x="50" y="325" width="300" height="48" rx="24" fill="#c05621"/>
  <text x="200" y="356" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Arachides du Sénégal</text>
</svg>
